name: Sync SCAU WeChat Mirror

on:
  schedule:
    # 每小时第 23 分钟同步一次。GitHub 的定时任务在高峰期可能延迟，这是正常现象。
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_new:
        description: "本次最多抓取的新文章数（留空使用脚本默认值）"
        required: false
        default: ""
      discover_pages:
        description: "列表抓取页数，每页 20 条（留空使用脚本默认值）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scau-wechat-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync articles
        env:
          SCAU_ACCOUNT_NAME: "华南农业大学"
          SCAU_WECHAT_ID: "scauxmt"
          SCAU_PAPER_ID: "6903558"
          SITE_URL: "https://icxin.github.io/scau-wechat-mirror"
          REPO_URL: "https://github.com/${{ github.repository }}"
          MAX_NEW: ${{ inputs.max_new }}
          DISCOVER_PAGES: ${{ inputs.discover_pages }}
          WECHAT_FETCH: "1"
          WECHAT_MAX: "20"
        run: python scripts/sync.py

      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Prepare GitHub Pages
        id: pages
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          headers=(
            -H "Authorization: Bearer ${{ github.token }}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          echo "GET /pages -> $code"

          if [ "$code" = "404" ]; then
            echo "Pages 站点尚未创建，尝试使用 workflow 构建类型自动启用…"
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              "${headers[@]}" -H "Content-Type: application/json" \
              "$api" -d '{"build_type":"workflow"}')
            echo "POST /pages -> $code"
          fi

          build_type=""
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            build_type=$(python -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || true)
          elif [ "$code" = "409" ]; then
            # 409 表示站点已存在，重新 GET 以读取 build_type。
            curl -sS -o /tmp/pages.json "${headers[@]}" "$api"
            build_type=$(python -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || true)
          fi

          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已启用，build_type=workflow。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages 未就绪::数据已同步并提交，但站点未部署。请到 Settings → Pages → Build and deployment，把 Source 设为 GitHub Actions（当前 build_type=${build_type:-unknown}）。"
          fi

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
